<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>ניהול - אגרות פוגעניות</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <style>
        @font-face { font-family: 'OHNivRaviv'; src: url('./assets/fonts/OHNivRaviv-Regular.woff2') format('woff2'); }
        @font-face { font-family: 'GveretLevin'; src: url('./assets/fonts/GveretLevin.otf') format('opentype'); }
        .numbers-font { font-family: 'GveretLevin', 'OHNivRaviv', sans-serif; }
        body { margin: 0; padding: 0; font-family: 'OHNivRaviv', sans-serif; }
        :root { --pink: #f46167; --red: #cf726a; --beige: #f9dec9; --white: #f9fcea; --dark: #5C2C31; }
        textarea, input { font-family: 'OHNivRaviv', sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const {useState, useEffect} = React;

        const SUPABASE_URL = 'https://enyibfygdrzripwkxuui.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVueWliZnlnZHJ6cmlwd2t4dXVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NzYyOTEsImV4cCI6MjEwODQ1MjI5MX0.a1wfPAqlZWYxdgg8leN1f6KLXm7RtdLMH4hFATVhjsk';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // שורת קטגוריה: שינוי שם נשמר ביציאה מהשדה או ב-Enter
        function LabelRow({label, i, total, usedCount, busy, onMove, onRename, onDelete}) {
            const [name, setName] = useState(label.name);
            useEffect(() => setName(label.name), [label.name]);
            const save = () => { const n = name.trim(); if(!n) { setName(label.name); return; } if(n !== label.name) onRename(label.id, n); };
            return <div className="bg-white rounded-xl shadow p-4 flex items-center gap-3">
                <div className="flex flex-col gap-1 shrink-0">
                    <button onClick={()=>onMove(i,-1)} disabled={busy || i===0} className="w-10 h-9 rounded-lg font-bold text-white" style={{background:'var(--red)', opacity:(busy||i===0)?0.25:1}} aria-label="הזז למעלה">▲</button>
                    <button onClick={()=>onMove(i,1)} disabled={busy || i===total-1} className="w-10 h-9 rounded-lg font-bold text-white" style={{background:'var(--red)', opacity:(busy||i===total-1)?0.25:1}} aria-label="הזז למטה">▼</button>
                </div>
                <span className="numbers-font font-bold text-base opacity-50 w-6 text-center shrink-0">{i+1}</span>
                <div className="flex-1 min-w-0">
                    <input value={name} onChange={e=>setName(e.target.value)} onBlur={save} onKeyDown={e=>{ if(e.key==='Enter') e.currentTarget.blur(); }} className="w-full border rounded-lg p-2" style={{borderColor:'#ddd'}} />
                    <p className="text-xs opacity-60 mt-1"><span className="numbers-font">{usedCount}</span> אגרות בקטגוריה</p>
                </div>
                <button onClick={()=>onDelete(label)} className="font-bold shrink-0" style={{color:'#dc2626'}}>מחק</button>
            </div>;
        }

        function App() {
            const [session, setSession] = useState(null);
            const [loading, setLoading] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            const [loggingIn, setLoggingIn] = useState(false);

            const [cards, setCards] = useState([]);
            const [thanks, setThanks] = useState([]);
            const [newMale, setNewMale] = useState('');
            const [newFemale, setNewFemale] = useState('');
            const [newThank, setNewThank] = useState('');
            const [tab, setTab] = useState('cards');
            const [busy, setBusy] = useState(false);
            const [noOrder, setNoOrder] = useState(false);
            const [labels, setLabels] = useState([]);
            const [noLabels, setNoLabels] = useState(false);
            const [newLabel, setNewLabel] = useState('');
            const [newCardLabel, setNewCardLabel] = useState('');
            const [cardFilter, setCardFilter] = useState('all');

            useEffect(() => {
                supabase.auth.getSession().then(({data}) => { setSession(data.session); setLoading(false); });
                const { data: sub } = supabase.auth.onAuthStateChange((_event, s) => setSession(s));
                return () => sub.subscription.unsubscribe();
            }, []);

            useEffect(() => { if(session) loadAll(); }, [session]);

            // הסדר כאן הוא בדיוק הסדר שבו הפריטים מופיעים באפליקציה (הראשון ברשימה = הראשון באפליקציה)
            const fetchOrdered = async (table) => {
                let r = await supabase.from(table).select('*').order('sort_order', {ascending:true}).order('created_at', {ascending:true});
                if(r.error) {
                    r = await supabase.from(table).select('*').order('created_at', {ascending:true});
                    return { data: r.data || [], missing: true };
                }
                return { data: r.data || [], missing: false };
            };

            const loadAll = async () => {
                const c = await fetchOrdered('cards');
                const t = await fetchOrdered('thanks');
                setNoOrder(c.missing || t.missing);
                setCards(c.data);
                setThanks(t.data);
                const l = await supabase.from('labels').select('*').order('sort_order', {ascending:true}).order('created_at', {ascending:true});
                setNoLabels(!!l.error);
                setLabels(l.error ? [] : (l.data || []));
            };

            // פריט חדש מקבל מספר נמוך מכל הקיימים, כדי שיופיע בתחילת הרשימה
            const topOrder = (list) => list.reduce((m, x) => Math.min(m, x.sort_order ?? 1), 1) - 1;

            const move = async (table, list, setList, i, dir) => {
                const j = i + dir;
                if(busy || (noOrder && table !== 'labels') || j < 0 || j >= list.length) return;
                const next = [...list];
                [next[i], next[j]] = [next[j], next[i]];
                const renum = next.map((x, k) => ({...x, sort_order: k + 1}));
                const old = Object.fromEntries(list.map(x => [x.id, x.sort_order]));
                setList(renum);
                setBusy(true);
                const results = await Promise.all(renum.filter(x => old[x.id] !== x.sort_order)
                    .map(x => supabase.from(table).update({ sort_order: x.sort_order }).eq('id', x.id)));
                setBusy(false);
                if(results.some(r => r.error)) { alert('שגיאה בשינוי הסדר, נסה שוב'); loadAll(); }
            };

            const MoveButtons = ({table, list, setList, i}) => <div className="flex flex-col gap-1 shrink-0">
                <button onClick={()=>move(table, list, setList, i, -1)} disabled={noOrder || busy || i===0} className="w-10 h-9 rounded-lg font-bold text-white" style={{background:'var(--red)', opacity:(noOrder||busy||i===0)?0.25:1}} aria-label="הזז למעלה">▲</button>
                <button onClick={()=>move(table, list, setList, i, 1)} disabled={noOrder || busy || i===list.length-1} className="w-10 h-9 rounded-lg font-bold text-white" style={{background:'var(--red)', opacity:(noOrder||busy||i===list.length-1)?0.25:1}} aria-label="הזז למטה">▼</button>
            </div>;

            const addLabel = async () => {
                const n = newLabel.trim();
                if(!n) return;
                if(labels.some(l => l.name === n)) { alert('כבר יש קטגוריה בשם הזה'); return; }
                setBusy(true);
                const { error } = await supabase.from('labels').insert({ name: n, sort_order: labels.reduce((m, x) => Math.max(m, x.sort_order ?? 0), 0) + 1 });
                setBusy(false);
                if(error) { alert('שגיאה בהוספה: ' + error.message); return; }
                setNewLabel('');
                loadAll();
            };

            const renameLabel = async (id, name) => {
                if(labels.some(l => l.id !== id && l.name === name)) { alert('כבר יש קטגוריה בשם הזה'); loadAll(); return; }
                const { error } = await supabase.from('labels').update({ name }).eq('id', id);
                if(error) alert('שגיאה בשינוי השם: ' + error.message);
                loadAll();
            };

            const deleteLabel = async (label) => {
                const n = cards.filter(c => c.label_id === label.id).length;
                if(!confirm(n ? `למחוק את הקטגוריה "${label.name}"? ${n} אגרות יישארו בלי קטגוריה.` : `למחוק את הקטגוריה "${label.name}"?`)) return;
                const { error } = await supabase.from('labels').delete().eq('id', label.id);
                if(error) alert('שגיאה במחיקה: ' + error.message);
                loadAll();
            };

            const setCardLabel = async (cardId, labelId) => {
                setCards(cs => cs.map(c => c.id === cardId ? {...c, label_id: labelId || null} : c));
                const { error } = await supabase.from('cards').update({ label_id: labelId || null }).eq('id', cardId);
                if(error) { alert('שגיאה בשמירת הקטגוריה: ' + error.message); loadAll(); }
            };

            const login = async (e) => {
                e.preventDefault();
                setLoginError('');
                setLoggingIn(true);
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                setLoggingIn(false);
                if (error) setLoginError('אימייל או סיסמה שגויים');
            };

            const logout = () => supabase.auth.signOut();

            const addCard = async () => {
                if(!newMale.trim() || !newFemale.trim()) { alert('צריך למלא גם נוסח בזכר וגם נוסח בנקבה'); return; }
                setBusy(true);
                const { error } = await supabase.from('cards').insert({ text_male: newMale.trim(), text_female: newFemale.trim(), ...(noOrder ? {} : { sort_order: topOrder(cards) }), ...(noLabels || !newCardLabel ? {} : { label_id: newCardLabel }) });
                setBusy(false);
                if(error) { alert('שגיאה בהוספה: ' + error.message); return; }
                setNewMale(''); setNewFemale('');
                loadAll();
            };

            const deleteCard = async (id) => {
                if(!confirm('למחוק את האגרת הזו? אי אפשר לשחזר.')) return;
                await supabase.from('cards').delete().eq('id', id);
                loadAll();
            };

            const addThank = async () => {
                if(!newThank.trim()) return;
                setBusy(true);
                const { error } = await supabase.from('thanks').insert({ text: newThank.trim(), ...(noOrder ? {} : { sort_order: topOrder(thanks) }) });
                setBusy(false);
                if(error) { alert('שגיאה בהוספה: ' + error.message); return; }
                setNewThank('');
                loadAll();
            };

            const deleteThank = async (id) => {
                if(!confirm('למחוק את התודה הזו? אי אפשר לשחזר.')) return;
                await supabase.from('thanks').delete().eq('id', id);
                loadAll();
            };

            if (loading) return <div style={{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', color:'var(--red)'}}>טוען...</div>;

            if (!session) return <div className="min-h-screen flex items-center justify-center p-4" style={{background:'linear-gradient(135deg,var(--beige),var(--white))'}}>
                <form onSubmit={login} className="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm">
                    <h1 className="text-2xl font-bold mb-6 text-center" style={{color:'var(--red)'}}>כניסה לניהול</h1>
                    <input type="email" placeholder="אימייל" value={email} onChange={e=>setEmail(e.target.value)} className="w-full border rounded-lg p-3 mb-3" style={{borderColor:'#ddd'}} required />
                    <input type="password" placeholder="סיסמה" value={password} onChange={e=>setPassword(e.target.value)} className="w-full border rounded-lg p-3 mb-3" style={{borderColor:'#ddd'}} required />
                    {loginError && <p className="text-sm mb-3" style={{color:'#dc2626'}}>{loginError}</p>}
                    <button type="submit" disabled={loggingIn} className="w-full p-3 rounded-lg text-white font-bold" style={{background:'linear-gradient(135deg,var(--pink),var(--red))', opacity: loggingIn?0.6:1}}>{loggingIn ? 'מתחבר...' : 'התחבר'}</button>
                </form>
            </div>;

            return <div className="min-h-screen p-4" style={{background:'linear-gradient(135deg,var(--beige),var(--white))'}}>
                <div className="max-w-2xl mx-auto pb-16">
                    <div className="flex justify-between items-center py-6">
                        <h1 className="text-2xl sm:text-3xl font-bold" style={{color:'var(--red)'}}>ניהול אגרות פוגעניות</h1>
                        <button onClick={logout} className="text-sm underline shrink-0" style={{color:'var(--red)'}}>התנתק</button>
                    </div>

                    {noOrder && <div className="rounded-xl p-4 mb-6 text-sm font-bold" style={{background:'#fef3c7', color:'#92400e'}}>שינוי סדר עדיין לא פעיל - צריך להריץ פעם אחת את עדכון מסד הנתונים.</div>}
                    {noLabels && <div className="rounded-xl p-4 mb-6 text-sm font-bold" style={{background:'#fef3c7', color:'#92400e'}}>קטגוריות עדיין לא פעילות - צריך להריץ פעם אחת את עדכון מסד הנתונים.</div>}
                    {!noOrder && <p className="text-sm mb-4 opacity-70" style={{color:'var(--dark)'}}>הסדר ברשימה הוא הסדר באפליקציה. החצים מזיזים פריט למעלה או למטה, ופריט חדש מתווסף בתחילת הרשימה.</p>}

                    <div className="flex gap-3 mb-6">
                        <button onClick={()=>setTab('cards')} className="px-5 py-2 rounded-full font-bold transition" style={{background: tab==='cards'?'var(--red)':'#e5e7eb', color: tab==='cards'?'white':'#555'}}>אגרות (<span className="numbers-font">{cards.length}</span>)</button>
                        <button onClick={()=>setTab('thanks')} className="px-5 py-2 rounded-full font-bold transition" style={{background: tab==='thanks'?'var(--red)':'#e5e7eb', color: tab==='thanks'?'white':'#555'}}>תודות (<span className="numbers-font">{thanks.length}</span>)</button>
                        {!noLabels && <button onClick={()=>setTab('labels')} className="px-5 py-2 rounded-full font-bold transition" style={{background: tab==='labels'?'var(--red)':'#e5e7eb', color: tab==='labels'?'white':'#555'}}>קטגוריות (<span className="numbers-font">{labels.length}</span>)</button>}
                    </div>

                    {tab === 'cards' && <div>
                        <div className="bg-white rounded-2xl shadow p-5 mb-6">
                            <h2 className="font-bold mb-3" style={{color:'var(--red)'}}>הוספת אגרת חדשה</h2>
                            <label className="block text-sm mb-1 font-bold" style={{color:'var(--dark)'}}>נוסח בלשון זכר</label>
                            <textarea value={newMale} onChange={e=>setNewMale(e.target.value)} rows={3} className="w-full border rounded-lg p-3 mb-3" style={{borderColor:'#ddd'}} placeholder="לדוגמה: מזל טוב על החתונה!..." />
                            <label className="block text-sm mb-1 font-bold" style={{color:'var(--dark)'}}>נוסח בלשון נקבה</label>
                            <textarea value={newFemale} onChange={e=>setNewFemale(e.target.value)} rows={3} className="w-full border rounded-lg p-3 mb-3" style={{borderColor:'#ddd'}} placeholder="אותו טקסט, מותאם לנקבה" />
                            {!noLabels && <div className="mb-3">
                                <label className="block text-sm mb-1 font-bold" style={{color:'var(--dark)'}}>קטגוריה</label>
                                <select value={newCardLabel} onChange={e=>setNewCardLabel(e.target.value)} className="w-full border rounded-lg p-3 bg-white" style={{borderColor:'#ddd'}}>
                                    <option value="">ללא קטגוריה</option>
                                    {labels.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}
                                </select>
                            </div>}
                            <button onClick={addCard} disabled={busy} className="px-6 py-2 rounded-full text-white font-bold" style={{background:'linear-gradient(135deg,var(--pink),var(--red))', opacity: busy?0.6:1}}>הוסף אגרת</button>
                        </div>
                        {!noLabels && labels.length > 0 && <div className="flex items-center gap-2 mb-3">
                            <span className="text-sm font-bold" style={{color:'var(--dark)'}}>הצג:</span>
                            <select value={cardFilter} onChange={e=>setCardFilter(e.target.value)} className="border rounded-lg p-2 bg-white" style={{borderColor:'#ddd'}}>
                                <option value="all">כל האגרות</option>
                                <option value="none">ללא קטגוריה</option>
                                {labels.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}
                            </select>
                            {cardFilter !== 'all' && <span className="text-xs opacity-60">בזמן סינון אי אפשר לשנות סדר</span>}
                        </div>}
                        <div className="space-y-3">
                            {cards.map((c, i) => ({c, i})).filter(({c}) => cardFilter === 'all' || (cardFilter === 'none' ? !c.label_id : c.label_id === cardFilter)).map(({c, i}) => <div key={c.id} className="bg-white rounded-xl shadow p-4 flex items-center gap-3">
                                {cardFilter === 'all' ? <MoveButtons table="cards" list={cards} setList={setCards} i={i} /> : null}
                                <span className="numbers-font font-bold text-base opacity-50 w-6 text-center shrink-0">{i+1}</span>
                                <div className="flex-1 min-w-0">
                                    <p className="whitespace-pre-wrap text-sm mb-1 break-words"><b>זכר:</b> {c.text_male}</p>
                                    <p className="whitespace-pre-wrap text-sm opacity-70 break-words"><b>נקבה:</b> {c.text_female}</p>
                                    {!noLabels && <select value={c.label_id || ''} onChange={e=>setCardLabel(c.id, e.target.value)} className="mt-2 border rounded-lg p-1.5 text-sm bg-white" style={{borderColor:'#ddd'}}>
                                        <option value="">ללא קטגוריה</option>
                                        {labels.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}
                                    </select>}
                                </div>
                                <button onClick={()=>deleteCard(c.id)} className="font-bold shrink-0" style={{color:'#dc2626'}}>מחק</button>
                            </div>)}
                            {cards.length===0 && <p className="text-center opacity-50 py-8">אין עדיין אגרות</p>}
                        </div>
                    </div>}

                    {tab === 'labels' && !noLabels && <div>
                        <div className="bg-white rounded-2xl shadow p-5 mb-6">
                            <h2 className="font-bold mb-3" style={{color:'var(--red)'}}>הוספת קטגוריה חדשה</h2>
                            <input value={newLabel} onChange={e=>setNewLabel(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') addLabel(); }} className="w-full border rounded-lg p-3 mb-3" style={{borderColor:'#ddd'}} placeholder="לדוגמה: יום נישואים" />
                            <button onClick={addLabel} disabled={busy} className="px-6 py-2 rounded-full text-white font-bold" style={{background:'linear-gradient(135deg,var(--pink),var(--red))', opacity: busy?0.6:1}}>הוסף קטגוריה</button>
                        </div>
                        <p className="text-sm mb-3 opacity-70" style={{color:'var(--dark)'}}>הסדר כאן הוא הסדר של הכפתורים באפליקציה. קטגוריה בלי אגרות לא מוצגת באפליקציה.</p>
                        <div className="space-y-3">
                            {labels.map((l, i) => <LabelRow key={l.id} label={l} i={i} total={labels.length} usedCount={cards.filter(c => c.label_id === l.id).length} busy={busy}
                                onMove={(idx, dir) => move('labels', labels, setLabels, idx, dir)} onRename={renameLabel} onDelete={deleteLabel} />)}
                            {labels.length===0 && <p className="text-center opacity-50 py-8">אין עדיין קטגוריות</p>}
                        </div>
                    </div>}

                    {tab === 'thanks' && <div>
                        <div className="bg-white rounded-2xl shadow p-5 mb-6">
                            <h2 className="font-bold mb-3" style={{color:'var(--red)'}}>הוספת תודה חדשה</h2>
                            <textarea value={newThank} onChange={e=>setNewThank(e.target.value)} rows={2} className="w-full border rounded-lg p-3 mb-3" style={{borderColor:'#ddd'}} placeholder="לדוגמה: תודה... אני חושב." />
                            <button onClick={addThank} disabled={busy} className="px-6 py-2 rounded-full text-white font-bold" style={{background:'linear-gradient(135deg,var(--pink),var(--red))', opacity: busy?0.6:1}}>הוסף תודה</button>
                        </div>
                        <div className="space-y-3">
                            {thanks.map((t, i) => <div key={t.id} className="bg-white rounded-xl shadow p-4 flex items-center gap-3">
                                <MoveButtons table="thanks" list={thanks} setList={setThanks} i={i} />
                                <span className="numbers-font font-bold text-base opacity-50 w-6 text-center shrink-0">{i+1}</span>
                                <p className="text-sm break-words flex-1 min-w-0">{t.text}</p>
                                <button onClick={()=>deleteThank(t.id)} className="font-bold shrink-0" style={{color:'#dc2626'}}>מחק</button>
                            </div>)}
                            {thanks.length===0 && <p className="text-center opacity-50 py-8">אין עדיין תודות</p>}
                        </div>
                    </div>}
                </div>
            </div>;
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
