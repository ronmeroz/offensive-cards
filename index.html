<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💌 אגרות ברכה פוגעניות</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <style>
        @font-face { font-family: 'OHNivRaviv'; src: url('./assets/fonts/OHNivRaviv-Regular.woff2') format('woff2'); }
        @font-face { font-family: 'GveretLevin'; src: url('./assets/fonts/GveretLevin.otf') format('opentype'); }
        body { margin: 0; padding: 0; font-family: 'OHNivRaviv', sans-serif; -webkit-tap-highlight-color: transparent; }
        .numbers-font { font-family: 'GveretLevin', 'OHNivRaviv', sans-serif; }
        :root { --pink: #f46167; --red: #cf726a; --beige: #f9dec9; --white: #f9fcea; --dark: #5C2C31; }
        @keyframes heart-float { 0%,100% { transform: translate(0,0) rotate(0deg); } 25% { transform: translate(30px,-40px) rotate(10deg); } 50% { transform: translate(-20px,-70px) rotate(-5deg); } 75% { transform: translate(40px,-50px) rotate(8deg); } }
        @keyframes bounce-in { 0% { transform: scale(0); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes envelope-open { 0% { transform: translateY(0) rotateX(0deg); } 100% { transform: translateY(-80px) rotateX(180deg); opacity: 0; } }
        @keyframes toast-in { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slide-up { from { transform: translateY(60px); } to { transform: translateY(0); } }
        @keyframes fade-up { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes card-appear { 0% { transform: translateY(100px) scale(0.8); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
        .custom-card { background: url('./assets/images/card-frame.png') center/100% 100% no-repeat; min-height: 220px; padding: 40px 35px; display: flex; align-items: center; justify-content: center; }
        .centered-text { text-align: center; line-height: 1.8; word-wrap: break-word; overflow-wrap: break-word; }
        textarea::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const {useState, useEffect, useRef} = React;

        const SUPABASE_URL = 'https://enyibfygdrzripwkxuui.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVueWliZnlnZHJ6cmlwd2t4dXVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NzYyOTEsImV4cCI6MjEwODQ1MjI5MX0.a1wfPAqlZWYxdgg8leN1f6KLXm7RtdLMH4hFATVhjsk';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const FloatingHearts = ({count = 50}) => {
            const hearts = ['לב1.png','לב2.png','לב3.png','לב4.png','לב5.png','לב6.png'];
            return <>{Array.from({length: count}).map((_, i) => {
                const h = hearts[i % 6];
                const size = 30 + Math.random() * 100;
                return <img key={i} src={`./assets/images/${h}`} alt="" className="absolute pointer-events-none"
                    style={{left:`${Math.random()*100}%`, top:`${Math.random()*100}%`, width:`${size}px`, opacity: 0.5 + Math.random()*0.5,
                    animation:`heart-float ${5+Math.random()*5}s ease-in-out ${Math.random()*3}s infinite`}} />;
            })}</>;
        };

        const CardDisplay = ({text}) => <div className="custom-card w-full max-w-lg"><div className="centered-text text-2xl font-bold numbers-font" style={{color:'var(--red)', wordWrap:'break-word', wordBreak:'break-word', whiteSpace:'pre-wrap', overflowWrap:'break-word'}}>{text}</div></div>;

        // הודעה קופצת בעיצוב של האתר (במקום חלון ההתראה של הדפדפן)
        const showToast = (message) => window.dispatchEvent(new CustomEvent('app-toast', {detail: message}));
        const ToastHost = () => {
            const [msg, setMsg] = useState(null);
            useEffect(() => {
                let timer;
                const on = (e) => { setMsg({text: e.detail, id: Date.now()}); clearTimeout(timer); timer = setTimeout(() => setMsg(null), 2200); };
                window.addEventListener('app-toast', on);
                return () => { window.removeEventListener('app-toast', on); clearTimeout(timer); };
            }, []);
            if(!msg) return null;
            return <div key={msg.id} className="fixed left-0 right-0 flex justify-center pointer-events-none" style={{bottom:'max(32px, env(safe-area-inset-bottom))', zIndex:100}}>
                <div className="px-6 py-3 rounded-full text-lg font-bold text-white shadow-2xl" style={{background:'linear-gradient(135deg,var(--pink),var(--red))', boxShadow:'0 10px 30px rgba(244,97,103,0.45)', animation:'toast-in 0.25s ease-out'}}>{msg.text}</div>
            </div>;
        };

        const BackTriangle = () => <span aria-hidden="true" style={{display:'inline-block', width:0, height:0, borderTop:'7px solid transparent', borderBottom:'7px solid transparent', borderRight:'11px solid var(--red)'}} />;

        // ---- מעטפה: אנימציית פתיחה (פריימים מהסרטון) + הכרטיס שיוצא מהכיס ----
        const ENV = { frames: 62, fps: 30, cw: 470, ch: 440, k: 0.82 };
        // הזזה קבועה כלפי מעלה של כל הסצנה (בלי תנועה בזמן הפתיחה), כדי שהמעטפה הסגורה לא תהיה נמוכה מדי
        const OFFSET = 42;
        const envImgs = [];
        let envPreloaded = false;
        const preloadEnvelope = () => {
            if(envPreloaded) return;
            envPreloaded = true;
            for(let i = 0; i < ENV.frames; i++) {
                const im = new Image();
                im.src = `./assets/images/envelope-anim/f${String(i).padStart(2,'0')}.webp`;
                im.onload = () => { if(im.decode) im.decode().catch(() => {}); };
                envImgs[i] = im;
            }
            const pk = new Image(); pk.src = './assets/images/envelope-anim/pocket.png';
        };

        const Envelope = ({isOpen, onOpen, onDone, children}) => {
            const rootRef = useRef(null);
            const cvRef = useRef(null);
            const doneRef = useRef(onDone);
            doneRef.current = onDone;
            const [W, setW] = useState(320);
            const [phase, setPhase] = useState('closed'); // closed | opening | rising | lift | out
            const [hover, setHover] = useState(false);

            const lastIdx = useRef(0);
            const drawFrame = (i) => {
                const cv = cvRef.current;
                if(!cv) return;
                lastIdx.current = i;
                for(let k = i; k >= 0; k--) {
                    const im = envImgs[k];
                    if(im && im.complete && im.naturalWidth) {
                        const ctx = cv.getContext('2d');
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';
                        ctx.clearRect(0, 0, cv.width, cv.height);
                        ctx.drawImage(im, 0, 0, cv.width, cv.height);
                        return;
                    }
                }
            };
            // הקנבס מצויר ברזולוציית המסך האמיתית כדי שלא יהיה מטושטש
            const dpr = Math.min(window.devicePixelRatio || 1, 3);

            // התאמת גודל לשטח הפנוי + טעינת הפריימים + ציור הפריים הראשון (מעטפה סגורה)
            useEffect(() => {
                preloadEnvelope();
                const el = rootRef.current;
                const calc = () => {
                    const r = el.getBoundingClientRect();
                    setW(Math.max(240, Math.min(r.width, r.height * ENV.cw / ENV.ch, 400)));
                };
                calc();
                const ro = new ResizeObserver(calc);
                ro.observe(el);
                const first = envImgs[0];
                const draw0 = () => drawFrame(0);
                if(first.complete && first.naturalWidth) draw0(); else first.addEventListener('load', draw0);
                return () => { ro.disconnect(); first.removeEventListener('load', draw0); };
            }, []);

            useEffect(() => { drawFrame(lastIdx.current); }, [W]);

            // מדידת גובה הכרטיס (כדי לחשב את מסלול היציאה שלו מהכיס)
            const cardRef = useRef(null);
            const [Hc, setHc] = useState(220);
            useEffect(() => {
                const el = cardRef.current;
                if(!el) return;
                const ro = new ResizeObserver(() => setHc(Math.max(120, el.offsetHeight)));
                ro.observe(el);
                return () => ro.disconnect();
            }, []);

            // ציר הזמן: הדש נפתח -> הכרטיס עולה בתוך הכיס (מאחורי הקדמי) -> יוצא למעלה -> קשת קדימה למרכז, והמעטפה נופלת
            const [calm, setCalm] = useState(false);
            const animRef = useRef(null);
            const geoRef = useRef({s: 1, Hc: 220});
            const T = { rise: 1400, up: 2100, apex: 2750, end: 3500 };
            const eo = x => 1 - Math.pow(1 - x, 3);
            const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
            const clamp01 = x => Math.max(0, Math.min(1, x));
            // מיקום הכרטיס (יחסית למרכז הבמה) לפי זמן מתחילת הפתיחה
            const poseAt = (ms) => {
                const {s, Hc} = geoRef.current, k = ENV.k;
                const hiddenDy = 171 * s - 0.5 * k * Hc + 0.95 * k * Hc;
                const peekDy = 171 * s - 0.5 * k * Hc;
                const kA = Math.max(0.6, Math.min(0.82, 196 * s / Hc));   // בשיא היציאה הכרטיס קטן מספיק כדי לא לעלות על הכותרת
                const apexDy = 196 * s - 0.5 * kA * Hc - 220 * s;   // התחתית של הכרטיס נקייה מהכיס הקדמי
                const finalDy = OFFSET * s;
                let y, sc = k;
                if(ms < T.rise) y = hiddenDy;
                else if(ms < T.up) y = hiddenDy + (peekDy - hiddenDy) * eo(clamp01((ms - T.rise) / (T.up - T.rise)));
                else if(ms < T.apex) { const q = eio(clamp01((ms - T.up) / (T.apex - T.up))); y = peekDy + (apexDy - peekDy) * q; sc = k + (kA - k) * q; }
                else {
                    const q = eio(clamp01((ms - T.apex) / (T.end - T.apex)));
                    y = apexDy + (finalDy - apexDy) * q;
                    sc = kA + (1 - kA) * q;
                }
                const u = clamp01((ms - T.up) / (T.end - T.up));
                const x = 0.09 * geoRef.current.W * Math.sin(Math.PI * u);
                const rot = -5 * Math.sin(Math.PI * u);
                return {y, x, sc, rot, bottom: 220 * s + y + 0.5 * sc * Hc};
            };
            const applyPose = (ms) => {
                const el = animRef.current;
                if(!el) return null;
                const P = poseAt(ms);
                el.style.transform = `translate(-50%,-50%) translate(${P.x}px,${P.y}px) rotate(${P.rot}deg) scale(${P.sc})`;
                return P;
            };
            geoRef.current = {s: W / ENV.cw, Hc, W};
            const animating = useRef(false);
            useEffect(() => { if(!animating.current) applyPose(phase === 'out' ? 1e6 : 0); }, [W, Hc, phase]);

            useEffect(() => {
                if(!isOpen) { setPhase('closed'); return; }
                if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                    setCalm(true); setPhase('out'); doneRef.current && doneRef.current(); return;
                }
                setPhase('opening');
                animating.current = true;
                const t0 = performance.now();
                let raf, lifted = false, risen = false, fell = false, finished = false;
                const loop = (now) => {
                    const ms = now - t0;
                    drawFrame(Math.min(ENV.frames - 1, Math.floor(ms / 1000 * ENV.fps)));
                    const P = applyPose(ms);
                    if(!risen && ms >= T.rise) { risen = true; setPhase('rising'); }
                    if(risen && !lifted && P && P.bottom <= 194 * geoRef.current.s) { lifted = true; setPhase('lift'); }
                    if(!fell && ms >= T.apex) { fell = true; setPhase('out'); }
                    if(ms >= T.end + 100 && !finished) { finished = true; animating.current = false; doneRef.current && doneRef.current(); return; }
                    raf = requestAnimationFrame(loop);
                };
                raf = requestAnimationFrame(loop);
                return () => { cancelAnimationFrame(raf); animating.current = false; };
            }, [isOpen]);

            const s = W / ENV.cw, Hs = ENV.ch * s;
            const envGone = phase === 'out';
            const cardUp = phase === 'lift' || phase === 'out';
            const fallDist = Math.max(450 * s, (window.innerHeight || 800)) + 40;
            const envFade = {transform: envGone ? `translateY(${fallDist}px)` : 'none', transition: envGone && !calm ? 'transform 750ms cubic-bezier(.55,0,1,.6)' : 'none'};

            return <div ref={rootRef} className="relative w-full h-full max-w-md mx-auto flex items-center justify-center" style={{maxHeight:'460px'}} onClick={!isOpen ? onOpen : undefined} onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}>
                <div className={`relative ${phase==='closed' ? 'cursor-pointer' : ''}`} style={{width: W, height: Hs, transform: `translateY(${-OFFSET * s}px) scale(${phase==='closed' && hover ? 1.04 : 1})`, transition: `transform ${phase==='closed' ? 250 : 900}ms ease-out`}}>
                    <p className="absolute left-0 right-0 text-center font-bold text-lg sm:text-xl pointer-events-none" style={{top: 441 * s, color:'var(--red)', visibility: phase==='closed' ? 'visible' : 'hidden'}}>לחץ כדי לפתוח</p>

                    <div className="absolute inset-0 pointer-events-none" style={{zIndex: 1}}>
                        <div className="absolute inset-0" style={envFade}>
                            <canvas ref={cvRef} width={Math.round(W * dpr)} height={Math.round(Hs * dpr)} className="absolute inset-0" style={{width:'100%', height:'100%'}} />
                        </div>
                    </div>

                    <div className="absolute inset-0 pointer-events-none" style={{zIndex: cardUp ? 4 : 2, clipPath: cardUp ? 'none' : `inset(-3000px -3000px ${13 * s}px -3000px)`}}>
                        <div ref={animRef} className="absolute" style={{left:'50%', top:'50%', width: W, willChange:'transform', visibility: (phase==='closed' || phase==='opening') ? 'hidden' : 'visible'}}>
                            <div ref={cardRef}>{children}</div>
                        </div>
                    </div>

                    <div className="absolute inset-0 pointer-events-none" style={{zIndex: 3}}>
                      <div className="absolute inset-0" style={envFade}>
                        <img src="./assets/images/envelope-anim/pocket.png" alt="" className="absolute" style={{left: 12 * s, top: 181 * s, width: 445 * s, height: 'auto', visibility: phase==='closed' || phase==='opening' ? 'hidden' : 'visible'}} />
                      </div>
                    </div>
                </div>
            </div>;
        };

        function App() {
            function getInitialScreen() {
                const p = new URLSearchParams(window.location.search);
                const h = new URLSearchParams(window.location.hash.substring(1));
                const id = p.get('card') || h.get('card');
                const tid = p.get('thank') || h.get('thank');
                if(tid) return 'thankView';
                return id ? 'view' : 'splash';
            }

            const [screen, setScreen] = useState(getInitialScreen);
            const [card, setCard] = useState(null);
            const [text, setText] = useState('');
            const [open, setOpen] = useState(false);
            const [done, setDone] = useState(false);
            const [showThanks, setShowThanks] = useState(false);
            const [cardId, setCardId] = useState(null);
            const [hearts, setHearts] = useState([]);
            const [cards, setCards] = useState([]);
            const [thanks, setThanks] = useState([]);
            const [gender, setGender] = useState('male');
            const [sentGender, setSentGender] = useState('male');
            const [displayText, setDisplayText] = useState('');

            // טעינת מאגר האגרות והתודות ממסד הנתונים
            // טעינה לפי הסדר שהמנהלים קבעו (sort_order); אם העמודה עוד לא קיימת - לפי תאריך יצירה
            const fetchOrdered = async (table) => {
                let r = await supabase.from(table).select('*').order('sort_order', {ascending:true}).order('created_at', {ascending:true});
                if(r.error) r = await supabase.from(table).select('*').order('created_at', {ascending:true});
                return r;
            };
            useEffect(() => {
                fetchOrdered('cards').then(({data, error}) => {
                    if(!error && data) setCards(data.map(c => ({id:c.id, textMale:c.text_male, textFemale:c.text_female})));
                });
                fetchOrdered('thanks').then(({data, error}) => {
                    if(!error && data) setThanks(data.map(t => t.text));
                });
            }, []);

            // עדכון טקסט לפי מין + איפוס לזכר בכל כרטיס חדש
            useEffect(() => {
                if (card) {
                    setGender('male'); // תמיד מתחיל בזכר
                    const text = card.textMale;
                    setDisplayText(text);
                }
            }, [card]);

            // עדכון טקסט כשמשנים מין
            useEffect(() => {
                if (card) {
                    const text = gender === 'male' ? card.textMale : card.textFemale;
                    setDisplayText(text);
                }
            }, [gender]);

            const [splashTimer, setSplashTimer] = useState(null);

            useEffect(() => {
                if(screen==='splash') {
                    const timer = setTimeout(() => setScreen('home'), 5000);
                    setSplashTimer(timer);
                    return () => clearTimeout(timer); // ניקוי כשעוזבים
                }
            }, [screen]);
            const [viewGender, setViewGender] = useState('male');
            const [thanksOpen, setThanksOpen] = useState(false);
            const [selectedThanks, setSelectedThanks] = useState('');
            const [thankId, setThankId] = useState(null);
            const [thankText, setThankText] = useState('');

            // טעינת אגרת/תודה שנשלחה אלינו, ישירות ממסד הנתונים (עובד לכל אחד, לא רק למי ששלח)
            // רץ גם בטעינה ראשונה וגם בכל פעם שהלינק (ה-hash) משתנה בלי רענון דף
            const reqRef = useRef(0);
            const loadFromUrl = () => {
                const p = new URLSearchParams(window.location.search);
                const h = new URLSearchParams(window.location.hash.substring(1));
                const id = p.get('card') || h.get('card');
                const tid = p.get('thank') || h.get('thank');
                const req = ++reqRef.current;
                if(tid) {
                    setOpen(false); setDone(false); setThanksOpen(false); setThankText(''); setThankId(tid); setScreen('thankView');
                    supabase.from('sent_thanks').select('*').eq('id', tid).single().then(({data}) => {
                        if(data && req === reqRef.current) setThankText(data.text);
                    });
                } else if(id) {
                    setOpen(false); setDone(false); setThanksOpen(false); setCard(null); setCardId(id); setScreen('view');
                    supabase.from('sent_cards').select('*').eq('id', id).single().then(({data}) => {
                        if(data && req === reqRef.current) { setCard({text:data.text}); setViewGender(data.gender || 'male'); }
                    });
                }
            };
            useEffect(() => {
                loadFromUrl();
                window.addEventListener('hashchange', loadFromUrl);
                return () => window.removeEventListener('hashchange', loadFromUrl);
            }, []);

            // כשעוזבים מסך צפייה - מנקים את הלינק מהכתובת, כדי שלחיצה חוזרת על אותו לינק תעבוד
            useEffect(() => {
                if(screen !== 'view' && screen !== 'thankView' && window.location.hash) {
                    history.replaceState(null, '', window.location.pathname + window.location.search);
                }
            }, [screen]);

            const save = async (t, g) => {
                const { data, error } = await supabase.from('sent_cards').insert({text:t, gender:g || 'male'}).select().single();
                if(error) { console.error(error); showToast('הייתה בעיה בשליחה, נסה שוב'); return null; }
                return data.id;
            };
            const link = (id) => `${window.location.origin}${window.location.pathname}#card=${id}`;
            const cardMsg = (id) => `קיבלת אגרת ברכה ${sentGender === 'female' ? 'יכוזרית' : 'יכוזר'}!\n${link(id)}`;
            const thankMsg = (id) => `קיבלת תודה! 💝\n${thankLink(id)}`;
            const wa = (id) => window.open(`https://wa.me/?text=${encodeURIComponent(cardMsg(id))}`, '_blank');
            const saveThank = async (t) => {
                const { data, error } = await supabase.from('sent_thanks').insert({text:t}).select().single();
                if(error) { console.error(error); showToast('הייתה בעיה בשליחה, נסה שוב'); return null; }
                return data.id;
            };
            const thankLink = (id) => `${window.location.origin}${window.location.pathname}#thank=${id}`;
            const waThank = (id) => window.open(`https://wa.me/?text=${encodeURIComponent(thankMsg(id))}`, '_blank');
            const pickThank = async (t) => {
                const id = await saveThank(t);
                if(!id) return;
                setSelectedThanks(t); setShowThanks(true); setThanksOpen(false); setThankId(id); setScreen('thankSend');
            };
            const send = async (t, g) => {
                const id = await save(t, g);
                if(id) { setSentGender(g || 'male'); setCardId(id); setScreen('send'); }
            };

            if(screen==='splash') return <div onClick={() => {if(splashTimer) clearTimeout(splashTimer); setScreen('home');}} className="min-h-screen flex flex-col items-center justify-center relative overflow-hidden cursor-pointer" style={{background:'linear-gradient(135deg,var(--beige),var(--white))'}}>
                <FloatingHearts count={50} />
                <div className="relative z-10 text-center flex-1 flex flex-col items-center justify-center" style={{animation:'bounce-in 0.6s'}}>
                    <img src="./assets/images/דמות-צהובה-כועסת-מסך-פתיחה.png" className="w-88 mx-auto mb-10" style={{width: '360px'}} />
                    <h1 className="text-6xl font-bold mb-2" style={{color:'var(--pink)'}}>אגרות פוגעניות</h1>
                </div>
                <div className="relative z-10 text-center mb-8">
                    <p className="text-base opacity-60" style={{color:'var(--red)'}}>לחץ בכל מקום להמשיך</p>
                    <p className="text-xs mt-2 opacity-50" style={{color:'var(--dark)'}}>פותח על ידי רון מרוז</p>
                </div>
            </div>;

            if(screen==='home') return <div className="min-h-screen p-4 pb-24" style={{background:'linear-gradient(135deg,var(--beige),var(--white))'}}>
                <div className="max-w-md mx-auto">
                    <div className="text-center py-8"><div className="text-5xl mb-2">💌</div><h1 className="text-4xl font-bold" style={{color:'var(--red)'}}>אגרות פוגעניות</h1></div>
                    <div className="space-y-6">{cards.map(c => <button key={c.id} onClick={() => {setCard(c); setGender('male'); setScreen('browse');}} className="w-full hover:scale-105 transition"><CardDisplay text={c.textMale} /></button>)}</div>
                </div>
                <button onClick={() => setScreen('create')} className="fixed bottom-8 left-8 w-16 h-16 rounded-full shadow-2xl hover:scale-110 transition z-50" style={{background:`linear-gradient(135deg,var(--pink),var(--red))`, backgroundImage:`url('./assets/images/אייקון-כתיבה.png')`, backgroundSize:'90%', backgroundPosition:'center', backgroundRepeat:'no-repeat'}} />
            </div>;

            if(screen==='browse') return <div className="min-h-screen p-4" style={{background:'linear-gradient(135deg,var(--beige),var(--white))'}}>
                <div className="max-w-md mx-auto pt-8">
                    <button onClick={() => {setScreen('home'); setGender('male');}} className="mb-6 text-xl hover:opacity-70 inline-flex items-center gap-2" style={{color:'var(--red)'}}><BackTriangle />חזרה</button>
                    <div className="mb-6"><CardDisplay text={displayText || card?.textMale || ''} /></div>

                    {/* כפתורי זכר/נקבה */}
                    <div className="flex gap-3 justify-center mb-6">
                        <button
                            onClick={() => setGender('male')}
                            className="px-6 py-2 rounded-full font-bold transition-all"
                            style={{
                                background: gender === 'male' ? 'linear-gradient(135deg,#bfe3f0,#8fc9de)' : '#e5e7eb',
                                color: gender === 'male' ? '#2c6479' : '#6b7280',
                                border: 'none',
                                cursor: 'pointer'
                            }}
                        >
                            זכר
                        </button>
                        <button
                            onClick={() => setGender('female')}
                            className="px-6 py-2 rounded-full font-bold transition-all"
                            style={{
                                background: gender === 'female' ? 'linear-gradient(135deg,#fbd2da,#f7afc0)' : '#e5e7eb',
                                color: gender === 'female' ? 'var(--red)' : '#6b7280',
                                border: 'none',
                                cursor: 'pointer'
                            }}
                        >
                            נקבה
                        </button>
                    </div>

                    <button onClick={() => send(displayText || card.textMale, gender)} className="mx-auto px-8 py-3 rounded-full flex items-center justify-center gap-3 text-xl font-bold shadow-2xl hover:shadow-pink-500/50 hover:scale-105 transition-all duration-300" style={{background:`linear-gradient(135deg,var(--pink),var(--red))`, boxShadow: '0 10px 40px rgba(244, 97, 103, 0.4)'}}>
                        <span style={{color: 'var(--white)'}}>שלח את האגרת</span>
                        <img src="./assets/images/אייקון-נייר-לבן.png" className="h-7 w-auto" alt="" />
                    </button>
                </div>
            </div>;

            if(screen==='create') return <div className="min-h-screen p-4" style={{background:'linear-gradient(135deg,var(--beige),var(--white))'}}>
                <div className="max-w-md mx-auto pt-8">
                    <h1 className="text-3xl font-bold text-center mb-6" style={{color:'var(--red)'}}>צור אגרת</h1>
                    <div className="custom-card">
                        <div style={{width:'100%', display:'flex', alignItems:'center', justifyContent:'center', minHeight:'140px'}}>
                            <textarea
                                value={text}
                                onChange={(e) => {if(e.target.value.length <= 120) setText(e.target.value);}}
                                placeholder="כתוב כאן למה חבר שלך מלשין"
                                maxLength={120}
                                className="w-full bg-transparent border-none outline-none text-xl font-bold numbers-font resize-none"
                                style={{
                                    color:'var(--red)',
                                    textAlign:'center',
                                    lineHeight:'1.5',
                                    overflow:'hidden',
                                    scrollbarWidth:'none',
                                    msOverflowStyle:'none',
                                    wordWrap:'break-word',
                                    wordBreak:'break-word',
                                    whiteSpace:'pre-wrap'
                                }}
                                rows={5}
                            />
                        </div>
                    </div>
                    <div className="text-base text-center mb-4 font-bold numbers-font" style={{color:'var(--red)', direction:'ltr'}}>
                        <span style={{fontFamily:'GveretLevin'}}>{text.length}</span>
                        <span style={{fontFamily:'OHNivRaviv'}}>/</span>
                        <span style={{fontFamily:'GveretLevin'}}>120</span>
                        <span style={{fontFamily:'OHNivRaviv'}}> תווים</span>
                    </div>
                    <div className="flex gap-4 justify-center items-center">
                        <button
                            onClick={() => text.trim() ? send(text) : showToast('כתוב משהו קודם!')}
                            className="hover:scale-110 transition-transform"
                            style={{background:'none', border:'none', padding:0, cursor:'pointer'}}
                        >
                            <img src="./assets/images/אייקון-שליחה.png" className="w-16 h-16 object-contain" alt="שלח" />
                        </button>
                        <button
                            onClick={() => setText('')}
                            className="hover:scale-110 transition-transform"
                            style={{background:'none', border:'none', padding:0, cursor:'pointer'}}
                        >
                            <img src="./assets/images/אייקון-פח.png" className="w-16 h-16 object-contain" alt="מחק" />
                        </button>
                    </div>
                    <button onClick={() => setScreen('home')} className="w-full mt-6 flex items-center justify-center gap-2 hover:opacity-70 text-lg" style={{color:'var(--red)'}}><BackTriangle />חזרה למסך הראשי</button>
                </div>
            </div>;

            if(screen==='send') return <div className="min-h-screen p-4" style={{background:'linear-gradient(135deg,var(--beige),var(--white))'}}>
                <div className="max-w-md mx-auto pt-8 text-center">
                    <div className="mb-4 flex justify-center">
						<img src="./assets/images/אייקון-וי.png" alt="וי" className="w-24 h-24" />
					</div>
                    <h1 className="text-3xl font-bold mb-4" style={{color:'var(--red)'}}>האגרת מוכנה יאגדה</h1>
                    <p className="text-xl mb-8" style={{color:'var(--dark)'}}>עכשיו תוכל לשלוח אותה לחבר השוטר</p>
                    <button onClick={() => wa(cardId)} className="w-full bg-green-500 text-white p-4 rounded-full text-xl font-bold shadow-lg hover:scale-105 transition mb-4">שלח בוואטסאפ</button>
                    <button onClick={() => {navigator.clipboard.writeText(link(cardId)); showToast('הלינק הועתק!');}} className="w-full bg-blue-500 text-white p-4 rounded-full text-xl font-bold shadow-lg hover:scale-105 transition mb-8">העתק לינק</button>
                    <button onClick={() => {setScreen('home'); setText(''); setCard(null);}} className="text-lg hover:opacity-70 inline-flex items-center gap-2" style={{color:'var(--red)'}}><BackTriangle />חזרה למסך הראשי</button>
                </div>
            </div>;

            if(screen==='view') { const isFemale = viewGender === 'female'; return <div className="h-[100dvh] p-4 relative overflow-hidden flex flex-col" style={{background:'linear-gradient(135deg,var(--beige),var(--white))'}}>
                <FloatingHearts count={30} />
                <div className="w-full max-w-md mx-auto relative z-10 flex-1 flex flex-col justify-center min-h-0">
                    <h1 className="text-2xl sm:text-3xl font-bold text-center mb-3 sm:mb-6 shrink-0 pt-2" style={{color:'var(--red)'}}>{isFemale ? 'קיבלת אגרת ברכה ישמאלנית' : 'קיבלת אגרת ברכה ישמאלני'}</h1>
                    <div className="flex items-center justify-center py-2" style={{flex:'0 1 400px', minHeight:0}}>
                        <Envelope key={cardId} isOpen={open} onOpen={() => setOpen(true)} onDone={() => setDone(true)}>{card && <CardDisplay text={card.text} />}</Envelope>
                    </div>
                    <div className="shrink-0 space-y-3 pb-2" style={done ? {animation:'slide-up 0.45s cubic-bezier(.2,1.2,.4,1)'} : {visibility:'hidden'}}>
                        <button onClick={() => setThanksOpen(true)} className="w-full p-3 rounded-full text-lg font-bold text-white shadow-lg active:scale-95 transition" style={{background:`linear-gradient(135deg,var(--pink),var(--red))`}}>
                            {isFemale ? 'תכבדי בתודה' : 'תכבד בתודה'}
                        </button>

                        <button onClick={() => window.location.href = window.location.pathname} className="w-full p-3 rounded-full text-lg font-bold text-white shadow-lg hover:scale-105 transition" style={{background:'linear-gradient(135deg,#a855f7,#ec4899)'}}>{isFemale ? 'שלחי אגרת בעצמך' : 'שלח אגרת בעצמך'}</button>
                    </div>
                </div>
                {thanksOpen && <div className="fixed inset-0 z-50 flex items-end justify-center" style={{background:'rgba(92,44,49,0.45)', touchAction:'none'}} onClick={() => setThanksOpen(false)}>
                    <div className="w-full max-w-md rounded-t-3xl p-4 pb-6 flex flex-col" style={{background:'var(--white)', maxHeight:'75dvh', touchAction:'auto', animation:'sheet-up 0.3s ease-out'}} onClick={e => e.stopPropagation()}>
                        <div className="flex items-center justify-between mb-3 shrink-0">
                            <p className="font-bold text-lg" style={{color:'var(--red)'}}>{isFemale ? 'בחרי תודה לשלוח:' : 'בחר תודה לשלוח:'}</p>
                            <button onClick={() => setThanksOpen(false)} className="text-2xl leading-none px-2" style={{color:'var(--red)'}} aria-label="סגור">✕</button>
                        </div>
                        <div className="flex flex-col gap-2 overflow-y-auto overflow-x-hidden" style={{overscrollBehavior:'contain', WebkitOverflowScrolling:'touch'}}>
                            {thanks.map((t,i) => <button key={i} onClick={() => pickThank(t)} className="w-full p-3 rounded-2xl text-base font-bold text-center shadow active:scale-95 transition shrink-0" style={{background:'white', color:'var(--red)', border:'2px solid var(--pink)'}}>{t}</button>)}
                        </div>
                    </div>
                </div>}
            </div>; }

            if(screen==='thankSend') return <div className="min-h-screen p-4" style={{background:'linear-gradient(135deg,var(--beige),var(--white))'}}>
                <div className="max-w-md mx-auto pt-8 text-center">
                    <div className="mb-4 flex justify-center">
                        <img src="./assets/images/אייקון-וי.png" alt="וי" className="w-24 h-24 object-contain" />
                    </div>
                    <h1 className="text-3xl font-bold mb-4" style={{color:'var(--red)'}}>התודה מוכנה לשליחה!</h1>
                    <div className="custom-card mb-8"><div className="centered-text text-xl font-bold numbers-font" style={{color:'var(--red)'}}>{selectedThanks}</div></div>
                    <button onClick={() => waThank(thankId)} className="w-full bg-green-500 text-white p-4 rounded-full text-xl font-bold shadow-lg hover:scale-105 transition mb-4">שלח בוואטסאפ</button>
                    <button onClick={() => {navigator.clipboard.writeText(thankLink(thankId)); showToast('הלינק הועתק!');}} className="w-full bg-blue-500 text-white p-4 rounded-full text-xl font-bold shadow-lg hover:scale-105 transition mb-8">העתק לינק</button>
                    <button onClick={() => {setScreen('home'); setText(''); setCard(null);}} className="text-lg hover:opacity-70 inline-flex items-center gap-2" style={{color:'var(--red)'}}><BackTriangle />חזרה למסך הראשי</button>
                </div>
            </div>;

            if(screen==='thankView') return <div className="h-[100dvh] p-4 relative overflow-hidden flex flex-col" style={{background:'linear-gradient(135deg,var(--beige),var(--white))'}}>
                <FloatingHearts count={30} />
                <div className="w-full max-w-md mx-auto relative z-10 flex-1 flex flex-col justify-center min-h-0 text-center">
                    <div className="shrink-0 mb-3 sm:mb-6 pt-2">
                        <h1 className="text-2xl sm:text-3xl font-bold text-center" style={{color:'var(--red)'}}>קיבלת תודה!</h1>
                        <p className="text-sm text-center mt-1 opacity-70" style={{color:'var(--red)'}}>אולי אתה לא כזה בור של חרא</p>
                    </div>
                    <div className="flex items-center justify-center py-2" style={{flex:'0 1 400px', minHeight:0}}>
                        <Envelope key={thankId} isOpen={open} onOpen={() => setOpen(true)} onDone={() => setDone(true)}><div className="custom-card"><div className="centered-text text-xl font-bold numbers-font" style={{color:'var(--red)'}}>{thankText}</div></div></Envelope>
                    </div>
                    <div className="shrink-0 pb-2" style={done ? {animation:'slide-up 0.45s cubic-bezier(.2,1.2,.4,1)'} : {visibility:'hidden'}}>
                        <button onClick={() => {setScreen('home');}} className="w-full p-3 rounded-full text-lg font-bold text-white shadow-lg hover:scale-105 transition" style={{background:'linear-gradient(135deg,#a855f7,#ec4899)'}}>שלח אגרת בעצמך</button>
                    </div>
                </div>
            </div>;
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<><App /><ToastHost /></>);
    </script>
</body>
</html>
